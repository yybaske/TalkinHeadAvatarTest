<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TalkingHead アバター表示テスト</title>
<script type="importmap">
{ "imports":
  {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #1b1b1f; color: #eee; }
  #avatar { width: 100%; height: 70vh; background: #24242a; }
  #panel { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input { flex: 1; min-width: 240px; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #111; color: #eee; }
  button, select { padding: 8px 14px; border-radius: 6px; border: 1px solid #555; background: #333; color: #eee; cursor: pointer; }
  button:hover { background: #444; }
  #status { padding: 0 16px; font-size: 13px; color: #9c9; min-height: 20px; }
</style>
</head>
<body>

<div id="avatar"></div>
<div id="status">まずは「サンプルで試す」を押して、土台が動くか確認してください</div>
<div id="panel">
  <button id="load-sample">サンプルアバターで試す</button>
  <input id="file" type="file" accept=".glb">
  <button id="load">自分のファイルを読み込む</button>
  <select id="mood">
    <option value="neutral">neutral</option>
    <option value="happy">happy</option>
    <option value="angry">angry</option>
    <option value="sad">sad</option>
    <option value="love">love</option>
  </select>
  <button id="gesture-handup">👋 手を挙げる</button>
  <button id="gesture-thumbup">👍 サムズアップ</button>
  <select id="view">
    <option value="full">full</option>
    <option value="upper">upper</option>
    <option value="head">head</option>
  </select>
</div>

<div id="panel">
  <input id="apikey" type="text" placeholder="Google Cloud TTSのAPIキー">
  <button id="init-tts">TTSを有効化</button>
</div>

<div id="panel">
  <input id="speak-text" type="text" placeholder="Hello, nice to meet you!" value="Hello, nice to meet you!">
  <button id="speak" disabled>しゃべらせる(英語/Google)</button>
</div>

<div id="panel">
  <input id="azure-key" type="text" placeholder="Azure Speechのキー">
  <input id="azure-region" type="text" placeholder="リージョン(例: japaneast)" style="max-width:160px">
  <input id="azure-text" type="text" placeholder="こんにちは、はじめまして" value="こんにちは、はじめまして">
  <button id="speak-ja">日本語でしゃべらせる(Azure)</button>
</div>

<script type="module">
import { TalkingHead } from "talkinghead";

const statusEl = document.getElementById('status');
const node = document.getElementById('avatar');

// 現在表示中のアバターのURLを覚えておき、TTS有効化時に再読み込みできるようにする
let currentAvatarUrl = null;
let head = null;

function createHead(apikey) {
  return new TalkingHead(node, {
    cameraRotateEnable: true,
    cameraPanEnable: false,
    cameraZoomEnable: true,
    ttsEndpoint: "https://texttospeech.googleapis.com/v1beta1/text:synthesize",
    ttsApikey: apikey || null,   // 個人の実験用途のみ。本番では絶対に使わないこと
    ttsLang: "en-GB",
    ttsVoice: "en-GB-Standard-A",
    lipsyncLang: 'en'
  });
}

// 最初はTTSなし(表示確認のみ)で作成
head = createHead();

document.getElementById('init-tts').addEventListener('click', async () => {
  const apikey = document.getElementById('apikey').value.trim();
  if (!apikey) {
    statusEl.textContent = 'APIキーを入力してください';
    return;
  }
  statusEl.textContent = 'TTSを有効化して再初期化中...';
  head.dispose?.();
  head = createHead(apikey);
  document.getElementById('speak').disabled = false;
  if (currentAvatarUrl) {
    await head.showAvatar({ url: currentAvatarUrl, body: 'F', avatarMood: 'neutral' });
  }
  statusEl.textContent = 'TTS有効化完了。「しゃべらせる」を押してテストしてください';
});

document.getElementById('speak').addEventListener('click', () => {
  const text = document.getElementById('speak-text').value.trim();
  if (!text) return;
  try {
    head.speakText(text);
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    console.error(err);
  }
});

document.getElementById('speak-ja').addEventListener('click', () => {
  const key = document.getElementById('azure-key').value.trim();
  const region = document.getElementById('azure-region').value.trim();
  const text = document.getElementById('azure-text').value.trim();
  if (!key || !region || !text) {
    statusEl.textContent = 'キー・リージョン・テキストをすべて入力してください';
    return;
  }

  statusEl.textContent = 'Azureで合成中...';

  const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(key, region);
  speechConfig.speechSynthesisVoiceName = "ja-JP-NanamiNeural";
  speechConfig.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Riff24Khz16BitMonoPcm;

  // 音声を自動再生させず、データだけ受け取る(TalkingHead側で再生とリップシンクを同時に行うため)
  const synthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig, null);

  const words = [], wtimes = [], wdurations = [];
  synthesizer.wordBoundary = (s, e) => {
    words.push(e.text);
    wtimes.push(e.audioOffset / 10000);       // ticks(100ns単位) → ミリ秒
    wdurations.push(e.duration / 10000);
  };

  synthesizer.speakTextAsync(
    text,
    async (result) => {
      synthesizer.close();
      if (result.reason !== SpeechSDK.ResultReason.SynthesizingAudioCompleted) {
        statusEl.textContent = '合成失敗: ' + result.errorDetails;
        return;
      }
      try {
        const audioCtx = new AudioContext();
        const audioBuffer = await audioCtx.decodeAudioData(result.audioData.slice(0));
        head.speakAudio({ audio: audioBuffer, words, wtimes, wdurations });
        statusEl.textContent = 'Azureでの再生成功';
      } catch (err) {
        statusEl.textContent = 'エラー: ' + err.message;
        console.error(err);
      }
    },
    (error) => {
      synthesizer.close();
      statusEl.textContent = 'エラー: ' + error;
      console.error(error);
    }
  );
});

document.getElementById('load-sample').addEventListener('click', async () => {
  statusEl.textContent = '読み込み中...';
  const url = 'https://raw.githubusercontent.com/met4citizen/TalkingHead/main/avatars/brunette.glb';
  try {
    await head.showAvatar({ url, body: 'F', avatarMood: 'neutral' });
    currentAvatarUrl = url;
    statusEl.textContent = 'サンプル読み込み成功。これで土台は正常に動作しています';
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    console.error(err);
  }
});

document.getElementById('load').addEventListener('click', async () => {
  const fileInput = document.getElementById('file');
  const file = fileInput.files[0];
  if (!file) {
    statusEl.textContent = 'ファイルを選択してください';
    return;
  }
  statusEl.textContent = '読み込み中...';
  const url = URL.createObjectURL(file);
  try {
    await head.showAvatar({ url, body: 'F', avatarMood: 'neutral' });
    currentAvatarUrl = url;
    statusEl.textContent = '読み込み成功。マウスドラッグで回転、スクロールでズームできます';
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    console.error(err);
  }
});

document.getElementById('mood').addEventListener('change', (e) => {
  head.setMood(e.target.value);
});

document.getElementById('gesture-handup').addEventListener('click', () => {
  head.playGesture('handup', 3);
});
document.getElementById('gesture-thumbup').addEventListener('click', () => {
  head.playGesture('thumbup', 3);
});

document.getElementById('view').addEventListener('change', (e) => {
  head.setView(e.target.value);
});
</script>

</body>
</html>
