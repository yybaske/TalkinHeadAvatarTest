<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ログイン | 社内AIポータル</title>

    <link
        rel="stylesheet"
        href="/static/login.css"
    >
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            AI
        </div>

        <h1>
            社内AIポータル
        </h1>

        <p class="login-description">
            アカウント情報を入力してください
        </p>

        {% if error %}
        <div class="error-message">
            ユーザーIDまたはパスワードが正しくありません。
        </div>
        {% endif %}

        <form
            method="post"
            action="/login"
        >

            <div class="form-group">

                <label
                    for="username"
                >
                    ユーザーID
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label
                    for="password"
                >
                    パスワード
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                ログイン
            </button>

        </form>

    </div>

</div>

</body>
</html>
